<!doctype html><html><body style="margin:0;background:#222">
<script type="module">
import * as THREE from "three";
import { preloadCharacterModels } from "/src/client/render/models/characters.ts";
import { preloadWeaponModels } from "/src/client/render/models/gltf.ts";
import { Viewmodel } from "/src/client/render/viewmodel.ts";
await Promise.all([preloadCharacterModels(), preloadWeaponModels()]);
const q = new URLSearchParams(location.search);
const r = new THREE.WebGLRenderer({ antialias: true }); r.setSize(innerWidth, innerHeight); document.body.appendChild(r.domElement);
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x8a7a60);

const sun = new THREE.DirectionalLight(0xffffff, 1.8); sun.position.set(3, 6, 4); scene.add(sun);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(60, 60), new THREE.MeshLambertMaterial({ color: 0xb89868 })); floor.rotation.x = -Math.PI / 2; floor.position.y = -1.6; scene.add(floor);

</script></body></html>
